name: Android Release Build & Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'VocalPlayer Release'
      release_notes:
        description: 'Release description / changelog'
        required: false
        default: 'Automated release build of VocalPlayer APK.'

permissions:
  contents: write

jobs:
  release:
    name: Build & Deploy Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Prepare signing keystore
      env:
        CUSTOM_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
          echo "Decoding custom signing keystore from secret..."
          echo "$CUSTOM_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks || echo "$CUSTOM_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
        elif [ ! -f "my-upload-key.jks" ]; then
          echo "Generating release signing keystore..."
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
        fi

    - name: Build Release APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || 'android' }}
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vocalplayer-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Determine Release Tag
      id: release_info
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=${{ github.event.inputs.release_title }} ($TAG_NAME)" >> $GITHUB_OUTPUT
          echo "body=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
        else
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=VocalPlayer $TAG_NAME" >> $GITHUB_OUTPUT
          echo "body=Automated release for tag $TAG_NAME" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.title }}
        body: ${{ steps.release_info.outputs.body }}
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
